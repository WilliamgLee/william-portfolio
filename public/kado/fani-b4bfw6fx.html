function easeBounce(t) {
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;

}

// Seeded random numbers (mulberry32), so the scenery looks the same every visit.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Game clock. Timers run on it, so everything pauses when the tab is hidden.
let T = 0;
const timers = [];
function wait(s) {
  return new Promise((res) => timers.push({ at: T + s, res }));
}
function runTimers() {
  for (let i = timers.length - 1; i >= 0; i--) {
    if (T >= timers[i].at) {
      const t = timers[i];
      timers.splice(i, 1);
      t.res();
    }
  }
}
// Waits until fn() is true (checked every frame).
function until(fn) {
  return new Promise((res) => {
    const chk = () => (fn() ? res() : wait(0).then(chk));
    chk();
  });
}

function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) {}
  return null;
}

  const vw = window.innerWidth, vh = window.innerHeight;
  const cssW = Math.min(vw, Math.round(vh * 0.62));
  const devW = cssW * DPR;
  N = Math.max(2, Math.round(devW / 230));
  const nw = Math.floor(devW / N), nh = Math.floor((vh * DPR) / N);
  if (nw === W && nh === H && view.width === W * N) return;
  W = nw;
  H = nh;
  scr.width = W;
  scr.height = H;
  g = ctx2d(scr);
  view.width = W * N;
  view.height = H * N;
  vctx.imageSmoothingEnabled = false;
  const cw = (W * N) / DPR, ch = (H * N) / DPR;
  view.style.width = cw + "px";
  view.style.height = ch + "px";
  OX = Math.round(((vw - cw) / 2) * DPR) / DPR;
  OY = Math.round(((vh - ch) / 2) * DPR) / DPR;
  view.style.left = OX + "px";
  view.style.top = OY + "px";
  const camEl = document.getElementById("cam");
  if (camEl) { camEl.style.left = OX + 8 + "px"; camEl.style.top = OY + 8 + "px"; }
  layout();
  buildBackground();
  placePhotoOverlay();
}

// Screen point (CSS px) -> logical pixel.
function toLogical(e) {
  return {
    x: ((e.clientX - OX) * DPR) / N,
    y: ((e.clientY - OY) * DPR) / N,
  };
}

function layout() {
  L.panelH = clamp(Math.round(H * 0.34), 142, 172);
  L.panelTop = H - L.panelH;
  L.gy = L.panelTop - clamp(Math.round((H - 300) * 0.13), 4, 28); // feet / table legs
  L.cx = W >> 1;
  L.tableW = 96;
  L.tableH = 24;
  L.tableX = L.cx - (L.tableW >> 1);
  L.tableTop = L.gy - L.tableH;
  L.faniX = L.tableX - 27;
  L.willX = L.tableX + L.tableW + 2;
  L.horizon = L.gy - 24;
  L.plateY = L.tableTop - 2;
  // cake layers: bottom (A), middle (B), top (C); y = top edge of each layer
  L.layers = [
    { w: 68, h: 14 },
    { w: 56, h: 12 },
    { w: 44, h: 11 },
  ];
  let y = L.plateY;
  for (const ly of L.layers) {
    y -= ly.h;
    ly.x = L.cx - (ly.w >> 1);
    ly.y = y;
  }
  L.cakeTop = L.layers[2].y;
  // two strands of fairy lights
  const sag = clamp(Math.round(H * 0.05), 14, 26);
  L.strands = [
    { y0: 5, y1: 3, sag, step: 11, off: 0 },
    { y0: 5 + Math.round(sag * 0.9), y1: 3 + Math.round(sag * 0.75), sag: Math.round(sag * 0.7), step: 13, off: 6 },
  ];
}

// ---------------------------------------------------------------------
//  Pixel drawing helpers (always whole pixels)
// ---------------------------------------------------------------------
function rect(x, y, w, h, c, cx = g) {
  cx.fillStyle = c;
  cx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function px(x, y, c, cx = g) {
  cx.fillStyle = c;
  cx.fillRect(Math.round(x), Math.round(y), 1, 1);
}
function blit(img, x, y, cx = g) {
  cx.drawImage(img, Math.round(x), Math.round(y));
}

// Ordered-dither "fade" patterns: 17 levels, each a 4x4 tile used as a fill pattern.
const ditherTiles = {};
function ditherPattern(level, color) {
  const key = level + color;
  if (!ditherTiles[key]) {
    const t = mk(4, 4), tc = ctx2d(t);
    tc.fillStyle = color;
    for (let y = 0; y < 4; y++)
      for (let x = 0; x < 4; x++) if (bayer(x, y) < level / 16) tc.fillRect(x, y, 1, 1);
    ditherTiles[key] = g.createPattern(t, "repeat");
  }
  return ditherTiles[key];
}
// Darkens the whole screen smoothly (used behind overlays).
function dim(a, color = "11,8,32") {
  g.fillStyle = "rgba(" + color + "," + a + ")";
  g.fillRect(0, 0, W, H);
}
// Covers a region with `color` at strength a (0..1) using a dither pattern.
function ditherRect(x, y, w, h, color, a, cx = g) {
  const lv = Math.round(clamp(a, 0, 1) * 16);
  if (lv <= 0) return;
  if (lv >= 16) return rect(x, y, w, h, color, cx);
  cx.fillStyle = ditherPattern(lv, color);
  cx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ---------------------------------------------------------------------
//  Pixel font (FONT data comes from the generated block below)
// ---------------------------------------------------------------------
const GLYPH_H = 9;
let atlasIdx = null;
const atlasByColor = new Map();
function fontAtlas(color) {
  let a = atlasByColor.get(color);
  if (a) return a;
  if (!atlasIdx) {
    atlasIdx = {};
    let x = 0;
    for (const ch in FONT) {
      atlasIdx[ch] = { x, w: FONT[ch][0] };
      x += FONT[ch][0] + 1;
    }
    atlasIdx.__w = x;
  }
  a = mk(atlasIdx.__w, GLYPH_H);
  const ac = ctx2d(a);
  ac.fillStyle = color;
  for (const ch in FONT) {
    const [w, ...rows] = FONT[ch];
    const ox = atlasIdx[ch].x;
    rows.forEach((bits, y) => {
      for (let i = 0; i < w; i++) if ((bits >> i) & 1) ac.fillRect(ox + i, y, 1, 1);
    });
  }
  atlasByColor.set(color, a);
  return a;
}
function glyph(ch) {
  if (!atlasIdx) fontAtlas("#fff");
  return atlasIdx[ch] || atlasIdx["?"];
}
function textW(s, scale = 1) {
  let w = 0;
  for (const ch of s) w += glyph(ch).w + 1;
  return Math.max(0, w - 1) * scale;
}
let HEART_COLOR = null; // when set, ♥ is drawn in this colour
// Draws s with the top of its capitals at y. Returns the x after the text.
function text(s, x, y, color = "#fff", scale = 1, cx = g) {
  const atlas = fontAtlas(color);
  const heart = HEART_COLOR ? fontAtlas(HEART_COLOR) : atlas;
  x = Math.round(x);
  y = Math.round(y);
  for (const ch of s) {
    const gl = glyph(ch);
    if (ch !== " ")
      cx.drawImage(ch === "♥" ? heart : atlas, gl.x, 0, gl.w, GLYPH_H, x, y, gl.w * scale, GLYPH_H * scale);
    x += (gl.w + 1) * scale;
  }
  return x;
}
function textC(s, cxPos, y, color, scale = 1, cx = g) {
  return text(s, cxPos - Math.floor(textW(s, scale) / 2), y, color, scale, cx);
}
// Text with a 1-pixel outline all round (or just a drop shadow).
function textO(s, x, y, color, outline, scale = 1, cx = g, shadowOnly = false) {
  const hc = HEART_COLOR;
  HEART_COLOR = null;
  const offs = shadowOnly ? [[0, 1], [1, 1]] : [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]];
  for (const [dx, dy] of offs) text(s, x + dx * scale, y + dy * scale, outline, scale, cx);
  HEART_COLOR = hc;
  return text(s, x, y, color, scale, cx);
}
function textOC(s, cxPos, y, color, outline, scale = 1, cx = g) {
  return textO(s, cxPos - Math.floor(textW(s, scale) / 2), y, color, outline, scale, cx);
}
// Word wrap into lines no wider than maxW pixels.
function wrap(s, maxW) {
  const out = [];
  for (const para of String(s).split("\n")) {
    let line = "";
    for (const word of para.split(" ")) {
      const t = line ? line + " " + word : word;
      if (!line || textW(t) <= maxW) line = t;
      else {
        out.push(line);
        line = word;
      }
    }
    out.push(line);
  }
  return out;
}

// ---------------------------------------------------------------------
//  Sprites: characters, balloons, table, cake, candles
// ---------------------------------------------------------------------
const K = "#2a1d3a"; // outline colour used everywhere

function rowsToCanvas(rows, pal = PAL) {
  const c = mk(rows[0].length, rows.length), x = ctx2d(c);
  rows.forEach((r, yy) => {
    for (let xx = 0; xx < r.length; xx++) {
      const ch = r[xx];
      if (ch === "." || !pal[ch]) continue;
      x.fillStyle = pal[ch];
      x.fillRect(xx, yy, 1, 1);
    }
  });
  return c;
}
function patchRows(rows, patches) {
  const out = rows.slice();
  for (const [x, y, s] of patches) out[y] = out[y].slice(0, x) + s + out[y].slice(x + s.length);
  return out;
}

// Each character comes in face variants, split at the waist so the upper
// body can "breathe" one pixel down while the feet stay put.
const CHAR = {};
function buildChars() {
  const build = (rows, faces, split, extra) => {
    const out = {};
    const variants = { base: rows };
    for (const k in faces) variants[k] = patchRows(rows, faces[k]);
    for (const k in variants) {
      const c = rowsToCanvas(variants[k]);
      if (extra) extra(ctx2d(c));
      const up = mk(c.width, split), lo = mk(c.width, c.height - split);
      ctx2d(up).drawImage(c, 0, 0);
      ctx2d(lo).drawImage(c, 0, -split);
      out[k] = { full: c, up, lo, split };
    }
    return out;
  };
  const bow = rowsToCanvas(BOW);
  CHAR.fani = build(FANI, FANI_FACES, 33, (x) => x.drawImage(bow, 1, 2));
  CHAR.will = build(WILLIAM, WILLIAM_FACES, 34);
}

// Balloons for the duel: pink, blue, and the grumpy dark one that costs a point.
const BALLOON = [
  "....KKKKK....",
  "..KKqqpppKK..",
  ".KqqqpppppPK.",
  ".KqqppppppPK.",
  "KqqpppppppPPK",
  "KqppppppppPPK",
  "KpppppppppPPK",
  "KpppppppppPPK",
  "KpppppppppPPK",
  ".KpppppppPPK.",
  ".KppppppPPPK.",
  "..KPpppPPPK..",
  "...KPPPPPK...",
  "....KKPKK....",
  ".....KPK.....",
  "....KPPPK....",
];
const BALLOON_PALS = [
  { K, p: "#ff8cc0", P: "#d9579b", q: "#ffd0e6" },
  { K, p: "#6cb6ff", P: "#3f7fe0", q: "#d2ebff" },
  { K: "#0d0a14", p: "#2c2838", P: "#1a1722", q: "#5d5672", w: "#ffffff", r: "#ff5577" },
];
const TRAP_FACE = [
  [3, 5, "w"], [9, 5, "w"], [4, 6, "w"], [8, 6, "w"],
  [4, 7, "ww"], [7, 7, "ww"],
  [5, 10, "rrr"], [4, 11, "r"], [8, 11, "r"],
];

  ".w..w..w.",
  "..w...w..",
  ".........",
  "ww.....ww",
  ".........",
  "..w...w..",
  ".w..w..w.",
  "....w....",
];
let BALLOONS = [], BURST_IMG = null;
function buildBalloons() {

  BURST_IMG = rowsToCanvas(BURST, { w: "#ffffff" });

// Soft round glow, drawn with additive blending for lights and flames.
const glowCache = {};
function glow(r, color) {
  const key = r + color;
  if (glowCache[key]) return glowCache[key];
  const s = r * 2 + 1, c = mk(s, s), x = ctx2d(c);
  const id = x.createImageData(s, s), d = id.data, [R, G, B] = hexRGB(color);
  for (let yy = 0; yy < s; yy++)
    for (let xx = 0; xx < s; xx++) {
      const dist = Math.hypot(xx - r, yy - r) / (r + 0.5);
      const a = dist >= 1 ? 0 : Math.pow(1 - dist, 2);
      const o = (yy * s + xx) * 4;
      d[o] = R; d[o + 1] = G; d[o + 2] = B; d[o + 3] = Math.round(a * 255);
    }
  x.putImageData(id, 0, 0);
  return (glowCache[key] = c);
}

// ---- table with a pink cloth -----------------------------------------
let TABLE = null;
function buildTable() {
  const w = L.tableW, h = L.tableH, c = mk(w + 2, h), x = ctx2d(c);
  // legs (behind the cloth)
  for (const lx of [9, w - 12]) {
    rect(lx, 10, 5, h - 10, K, x);
    rect(lx + 1, 10, 3, h - 11, "#7a5444", x);
    rect(lx + 3, 10, 1, h - 11, "#5a3a30", x);
    rect(lx, h - 2, 5, 2, K, x);
  }
  // cloth: hem is a row of scallops
  const hem = (i) => 14 + Math.round(1.6 * Math.abs(Math.sin((Math.PI * (i + 2)) / 8)));
  for (let i = 0; i < w + 2; i++) rect(i, 0, 1, hem(i) + 1, K, x);
  for (let i = 1; i < w + 1; i++) {
    const b = hem(i);
    rect(i, 1, 1, b - 1, "#ff9ccb", x);
    // soft vertical folds
    const f = (i + 3) % 16;
    if (f === 0 || f === 1) rect(i, 4, 1, b - 4, "#f07fb6", x);
    if (f === 2) rect(i, 4, 1, b - 4, "#ffb8d8", x);
    px(i, b - 1, "#e86aa5", x);
    // lace dots along the hem
    if (i % 4 === 2) px(i, b - 3, "#fff4fa", x);
  }
  rect(1, 1, w, 3, "#ffc8e0", x); // table top
  rect(1, 1, w, 1, "#ffe4f0", x);
  rect(1, 4, w, 1, "#e86aa5", x); // edge of the top
  TABLE = c;
}

// ---- cake: three layers, plate, candles --------------------------------
let LAYER_IMG = [], PLATE = null, CANDLE_IMG = [];
function buildCake() {
  const specs = [
    // sponge [base, shade, light], frosting [base, shade, light]
    { sp: ["#7cbcff", "#5a98e8", "#a9d6ff"], fr: ["#ffa8cd", "#e57fb1", "#ffd6e8"], deco: "pearls", seed: 3 },
    { sp: ["#ff9cc6", "#e57aab", "#ffc4de"], fr: ["#fff8fb", "#e3d4e4", "#ffffff"], deco: "dots", seed: 7 },
    { sp: ["#8cc8ff", "#67a6ef", "#b6deff"], fr: ["#ffa8cd", "#e57fb1", "#ffd6e8"], deco: "sprinkles", seed: 11 },
  ];
  LAYER_IMG = specs.map((s, i) => {
    const { w, h } = L.layers[i];
    const c = mk(w + 2, h + 2), x = ctx2d(c), R = rng(s.seed);
    rect(1, 0, w, h + 2, K, x);
    rect(0, 1, w + 2, h, K, x);
    rect(1, 1, w, h, s.sp[0], x);
    rect(1, 1, 2, h, s.sp[2], x);
    rect(w - 4, 1, 5, h, s.sp[1], x);
    rect(1, h, w, 1, s.sp[1], x);
    // frosting: 3px band plus drips of different lengths
    const thick = new Array(w).fill(3);
    for (let p = 1 + Math.floor(R() * 4); p < w - 2; p += 4 + Math.floor(R() * 5)) {
      const dw = 2 + Math.floor(R() * 2), extra = 2 + Math.floor(R() * Math.min(5, h - 6));
      for (let k = 0; k < dw && p + k < w; k++) thick[p + k] = 3 + extra - (k === 0 || k === dw - 1 ? 1 : 0);
    }
    for (let i2 = 0; i2 < w; i2++) {
      rect(1 + i2, 1, 1, thick[i2], s.fr[0], x);
      px(1 + i2, 1 + thick[i2], s.fr[1], x);
    }
    rect(1, 1, w, 1, s.fr[2], x);
    rect(w - 3, 2, 4, 1, s.fr[1], x);
    if (s.deco === "pearls")
      for (let i2 = 3; i2 < w - 1; i2 += 4) { px(1 + i2, h - 2, "#ffffff", x); px(1 + i2, h - 1, "#cfe3ff", x); }
    if (s.deco === "dots")
      for (let i2 = 4; i2 < w - 2; i2 += 6) { rect(1 + i2, h - 4, 2, 2, "#69b4ff", x); px(1 + i2, h - 4, "#b9dcff", x); }
    if (s.deco === "sprinkles") {
      const cols = ["#ffe27a", "#ffffff", "#ff5fa2", "#3f86e6", "#b48cff"];
      for (let i2 = 2; i2 < w - 2; i2 += 2 + Math.floor(R() * 3)) px(1 + i2, 2 + Math.floor(R() * 2), cols[Math.floor(R() * cols.length)], x);
      for (let i2 = 4; i2 < w - 4; i2 += 5) px(1 + i2, h - 3, cols[i2 % 5], x);
    }
    return c;
  });
  // plate
  PLATE = mk(80, 4);
  const p = ctx2d(PLATE);
  rect(1, 0, 78, 4, K, p);
  rect(0, 1, 80, 2, K, p);
  rect(1, 1, 78, 1, "#f6f1ff", p);
  rect(2, 2, 76, 1, "#cfc3e6", p);
  // thin candles: pink or blue with white bands
  CANDLE_IMG = ["#ff6fae", "#4f9dff"].map((col) => {
    const c = mk(1, 6), x = ctx2d(c);
    for (let yy = 0; yy < 6; yy++) px(0, yy, yy % 3 === 1 ? "#fdf6ff" : col, x);
    return c;
  });
}

// Candle flame shapes (one pixel wide), bottom row last.
// o = orange tip, y = yellow, W = white-hot core.
const FLAMES = [["o", "y", "W"], ["o", "y", "y", "W"], ["y", "y", "W"], ["o", "o", "y", "W"]];
const FLAME_LEAN = [[".o", "y.", "W."], ["..o", ".y.", "W.."]];
const FLAME_COL = { o: "#ff9a45", y: "#ffd86a", W: "#fffbe2" };
function drawFlameRows(rows, x, y) {
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], yy = y - (rows.length - 1 - i);
    for (let j = 0; j < r.length; j++) if (r[j] !== ".") px(x + j, yy, FLAME_COL[r[j]]);

}

// ---------------------------------------------------------------------
//  The night garden: sky, city, lawn, fairy lights, table, cake, us two
// ---------------------------------------------------------------------
let BG = null;
const STARS = [], BLINKERS = [];

const S = {
  mode: "gate", // gate | scene | duel | photo | letter
  layers: [null, null, null], // drop start time of each cake layer
  candles: [],
  wind: 0,
  blowT: 0,
  party: null,
  lights: 0, // extra sparkle on the fairy lights
  chars: {
    fani: { face: "base", jumpT: -9, jumpH: 7, cheer: 0, blinkAt: 2, talk: false, mood: null, moodUntil: 0 },
    will: { face: "base", jumpT: -9, jumpH: 7, cheer: 0, blinkAt: 3.3, talk: false, mood: null, moodUntil: 0 },
  },
  shoot: { at: 5, t: -1, x: 0, y: 0 },
};

function buildBackground() {
  BG = mk(W, H);
  const b = ctx2d(BG);
  const R = rng(1810);
  const hz = L.horizon;
  const sky = ["#0b0920", "#100c2b", "#161036", "#1d1442", "#26184f", "#311c5c", "#3e2068", "#4e2573",
    "#612a7c", "#773183", "#8f3988", "#a8438c", "#c1508f", "#d86192", "#ec7797", "#f88f9f"].map(hexRGB);
  const id = b.createImageData(W, H), d = id.data;
  const put = (o, c) => { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; };
  for (let y = 0; y < hz; y++) {
    const t = Math.pow(y / hz, 1.6) * (sky.length - 1);
    const i = Math.floor(t), f = t - i;
    for (let x = 0; x < W; x++) put((y * W + x) * 4, i < sky.length - 1 && f > bayer(x, y) ? sky[i + 1] : sky[i]);
  }
  // moon with a soft halo
  const mx = W - 36, my = Math.max(22, Math.round(hz * 0.16)), mr = 9;
  const moonC = hexRGB("#fff3d1"), moonS = hexRGB("#f1d9a2"), crater = hexRGB("#e6cb8f");
  for (let y = my - 22; y <= my + 22; y++)
    for (let x = mx - 22; x <= mx + 22; x++) {
      if (x < 0 || y < 0 || x >= W || y >= hz) continue;
      const r = Math.hypot(x - mx, y - my), o = (y * W + x) * 4;
      if (r <= mr) {
        const shade = Math.hypot(x - mx + 3, y - my + 3) > mr + 1.5;
        put(o, shade ? moonS : moonC);
      } else if (r < mr + 12) {
        const a = Math.pow(1 - (r - mr) / 12, 1.6) * 0.45;
        if (bayer(x, y) < a) { d[o] = (d[o] + 80) >> 1; d[o + 1] = (d[o + 1] + 70) >> 1; d[o + 2] = (d[o + 2] + 110) >> 1; }
      }
    }
  for (const [cx, cy, rr] of [[-3, -2, 2], [2, 2, 1.5], [3, -4, 1], [-2, 4, 1]])
    for (let y = -2; y <= 2; y++)
      for (let x = -2; x <= 2; x++)
        if (Math.hypot(x, y) <= rr) put(((my + cy + y) * W + (mx + cx + x)) * 4, crater);
  b.putImageData(id, 0, 0);

  // faint stars (fixed) and bright ones (twinkle, drawn every frame)
  STARS.length = 0;
  const area = W * hz;
  for (let i = 0; i < area / 260; i++) {
    const x = Math.floor(R() * W), y = Math.floor(Math.pow(R(), 1.4) * hz * 0.8);
    if (Math.hypot(x - mx, y - my) < 16) continue;
    px(x, y, R() < 0.5 ? "#5d548f" : "#8c82c4", b);
  }
  for (let i = 0; i < area / 1500; i++) {
    const x = 3 + Math.floor(R() * (W - 6)), y = 3 + Math.floor(Math.pow(R(), 1.3) * hz * 0.7);
    if (Math.hypot(x - mx, y - my) < 18) continue;
    STARS.push({ x, y, ph: R() * 6.28, sp: 1 + R() * 2, c: pick(["#ffffff", "#d8e8ff", "#ffe0ef"]) });
  }

  // city: a far row and a near row of buildings with lit windows
  BLINKERS.length = 0;
  const lit = ["#ffd36e", "#ffe9a8", "#8fd3ff", "#ff9ccf", "#ffd36e"];
  const city = (base, color, minH, maxH, minW, maxW, windows) => {
    let x = -Math.floor(R() * 8);
    while (x < W) {
      const bw = minW + Math.floor(R() * (maxW - minW)), bh = minH + Math.floor(R() * (maxH - minH));
      const top = base - bh;
      rect(x, top, bw, bh, color, b);
      if (R() < 0.3) { rect(x + 2, top - 2, bw - 4, 2, color, b); }
      if (R() < 0.25) {
        const ax = x + Math.floor(bw / 2);
        rect(ax, top - 7, 1, 7, color, b);
        BLINKERS.push({ x: ax, y: top - 8, ph: R() * 6 });
      }
      if (windows)
        for (let wy = top + 3; wy < base - 3; wy += 4)

  buildCake();

function buildClouds() {

      }

//  Sound: a tiny chiptune synth (pulse, triangle, noise) with Web Audio.
//  No audio files; every note is generated here.

const AU = { ctx: null, out: null, music: null, sfx: null, waves: null, noise: null, muted: store("kadoMuted") === "1" };

  if (!AC) return null;
  let ctx;
  try { ctx = new AC({ latencyHint: "interactive" }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
  audioGraph(ctx);

  comp.attack.value = 0.003; comp.release.value = 0.2;

  AU.sfx = ctx.createGain(); AU.sfx.gain.value = 0.75; AU.sfx.connect(AU.out);

    const n = 40, re = new Float32Array(n), im = new Float32Array(n);

  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const ctx = audioInit();
  if (!ctx) return;
  try {
    const s = ctx.createBufferSource();
    s.buffer = ctx.createBuffer(1, 1, 22050);
    s.connect(ctx.destination);
    s.start(0);
  } catch (e) {}

  AU.muted = m;

function noteNum(tok) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(tok);
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  return 12 * (+m[3] + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
}
// "A4 . C5 - ..." : each token lasts `unit` sixteenths; "." holds, "-" rests.
function parseLine(str, unit) {
  const out = [];
  let cur = null, step = 0;
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === ".") { if (cur) cur.d += unit; }
    else if (tok === "-") cur = null;
    else { cur = { s: step, d: unit, m: noteNum(tok) }; out.push(cur); }
    step += unit;
  }
  return out;
}

// ---- songs -------------------------------------------------------------
// "Lagu Fani": an original 8-bar tune in F major, arranged three ways.
const THEME = "A4 . C5 . F5 . E5 D5  C5 . A4 . C5 D5 C5 .  D5 . F5 . A5 . G5 F5  E5 . D5 . C5 . . .  " +
  "D5 . F5 . Bb5 . A5 G5  F5 . D5 . F5 G5 F5 .  E5 . G5 . C6 . Bb5 A5  G5 . E5 . G5 . A5 .";
const CHORDS = [[65, 69, 72, 77], [62, 65, 69, 72], [58, 62, 65, 69], [60, 64, 67, 72],
  [58, 62, 65, 70], [55, 58, 62, 65], [60, 64, 67, 70], [60, 64, 67, 72]];
const ROOTS = [41, 38, 34, 36, 34, 31, 36, 36];

function song(bpm, len, loop, parts) {
  const events = [];
  for (const [inst, notes] of parts) for (const n of notes) events.push({ s: n.s, d: n.d || 1, play: (dest, t, dur) => INST[inst](dest, t, dur, n.m) });
  events.sort((a, b) => a.s - b.s);
  return { bpm, len, loop, events };
}
function themeSong(style) {
  const mel = parseLine(THEME, 2);
  const arp = [], bass = [], kick = [], snare = [], hat = [];
  const pat = [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 2, 3, 1, 2];
  for (let bar = 0; bar < 8; bar++) {
    const s0 = bar * 16, ch = CHORDS[bar], r = ROOTS[bar];
    if (style === "soft") {
      for (let i = 0; i < 16; i += 2) arp.push({ s: s0 + i, d: 2, m: ch[pat[i]] });
      bass.push({ s: s0, d: 8, m: r + 12 }, { s: s0 + 8, d: 8, m: r + 19 });
      continue;
    }
    for (let i = 0; i < 16; i++) arp.push({ s: s0 + i, d: 1, m: ch[pat[i]] });
    for (let i = 0; i < 16; i += 2) bass.push({ s: s0 + i, d: 2, m: r + ((i >> 1) % 2 ? 12 : 0) });
    if (style === "duel") {
      for (const i of [0, 4, 8, 12]) kick.push({ s: s0 + i });
      for (const i of [4, 12]) snare.push({ s: s0 + i });
      for (let i = 0; i < 16; i += 1) if (i % 4 !== 0) hat.push({ s: s0 + i });
    } else {
      for (const i of [0, 8]) kick.push({ s: s0 + i });
      for (const i of [4, 12]) snare.push({ s: s0 + i });
      for (const i of [2, 6, 10, 14]) hat.push({ s: s0 + i });
    }
  }
  if (style === "soft") return song(84, 128, true, [["leadSoft", mel], ["arpSoft", arp], ["bassSoft", bass]]);
  if (style === "duel") return song(152, 128, true, [["leadHot", mel], ["arp", arp], ["bass", bass], ["kick", kick], ["snare", snare], ["hat", hat]]);
  return song(112, 128, true, [["lead", mel], ["arp", arp], ["bass", bass], ["kick", kick], ["snare", snare], ["hat", hat]]);
}
// Happy Birthday (traditional melody, public domain), in C, 3/4.
function birthdaySong() {
  const tune = [["G4", 3], ["G4", 1], ["A4", 4], ["G4", 4], ["C5", 4], ["B4", 8], ["G4", 3], ["G4", 1],
    ["A4", 4], ["G4", 4], ["D5", 4], ["C5", 8], ["G4", 3], ["G4", 1], ["G5", 4], ["E5", 4], ["C5", 4],
    ["B4", 4], ["A4", 8], ["F5", 3], ["F5", 1], ["E5", 4], ["C5", 4], ["D5", 4], ["C5", 12]];
  const mel = [];
  let s = 0;
  for (const [n, d] of tune) { mel.push({ s, d, m: noteNum(n) }); s += d; }
  // bars after the pick-up: [start, length, root, chord]
  const bars = [[4, 12, 48, [64, 67, 72]], [16, 12, 43, [62, 65, 71]], [28, 12, 43, [62, 65, 71]], [40, 12, 48, [64, 67, 72]],
    [52, 12, 48, [64, 67, 70]], [64, 16, 41, [65, 69, 72]], [80, 4, 48, [64, 67, 72]], [84, 8, 43, [62, 65, 71]], [92, 12, 48, [64, 67, 72]]];
  const bass = [], stab = [], kick = [], hat = [];
  for (const [b0, len, root, ch] of bars) {
    bass.push({ s: b0, d: 4, m: root });
    kick.push({ s: b0 });
    for (let k = b0 + 4; k < b0 + len; k += 4) for (const m of ch) stab.push({ s: k, d: 3, m });
    for (let k = b0 + 2; k < b0 + len; k += 4) hat.push({ s: k });
  }
  const sparkle = [84, 88, 91, 96].map((m, i) => ({ s: 96 + i, d: 1, m }));
  return song(100, 108, false, [["leadBday", mel], ["bass", bass], ["stab", stab], ["kick", kick], ["hat", hat], ["arp", sparkle]]);
}
let SONGS = null;
function buildSongs() {
  SONGS = { main: themeSong("main"), duel: themeSong("duel"), soft: themeSong("soft"), bday: birthdaySong() };
}

// ---- sequencer ---------------------------------------------------------
const PLAYER = { song: null, bus: null, t0: 0, next: 0, onEnd: null, name: "" };
function playSong(name, onEnd) {
  if (!AU.ctx) return;
  if (PLAYER.name === name && PLAYER.song) return;
  stopSong(0.4);
  const ctx = AU.ctx, bus = ctx.createGain();
  bus.gain.setValueAtTime(0.0001, ctx.currentTime);
  bus.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.15);
  bus.connect(AU.music);
  Object.assign(PLAYER, { song: SONGS[name], name, bus, t0: ctx.currentTime + 0.12, next: 0, onEnd: onEnd || null });
}
function stopSong(fade = 0.4) {
  if (PLAYER.bus && AU.ctx) {
    const t = AU.ctx.currentTime, b = PLAYER.bus;
    b.gain.cancelScheduledValues(t);
    b.gain.setValueAtTime(b.gain.value, t);
    b.gain.linearRampToValueAtTime(0.0001, t + fade);
    setTimeout(() => b.disconnect(), (fade + 1) * 1000);
  }
  PLAYER.song = null;
  PLAYER.bus = null;
  PLAYER.name = "";
}
function pumpSong() {
  const s = PLAYER.song;
  if (!s || !AU.ctx || AU.ctx.state !== "running") return;
  const ctx = AU.ctx, step = 60 / s.bpm / 4, horizon = ctx.currentTime + 0.25;
  for (;;) {
    const ev = s.events[PLAYER.next];
    if (!ev) {
      if (s.loop) { PLAYER.next = 0; PLAYER.t0 += s.len * step; continue; }
      if (ctx.currentTime > PLAYER.t0 + s.len * step) {
        const cb = PLAYER.onEnd;
        PLAYER.song = null;
        PLAYER.name = "";
        if (cb) cb();
      }
      return;
    }
    const t = PLAYER.t0 + ev.s * step;
    if (t > horizon) return;
    if (t > ctx.currentTime - 0.03) ev.play(PLAYER.bus, t, ev.d * step);
    PLAYER.next++;
  }
}
setInterval(pumpSong, 30);

// Continuous "blowing" noise while the candles are being blown out.
let BLOW = null;
function blowLevel(v) {
  if (!ready()) return;
  const ctx = AU.ctx;
  if (!BLOW && v > 0.01) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), gn = ctx.createGain();
    s.buffer = AU.noise; s.loop = true;
    f.type = "bandpass"; f.frequency.value = 700; f.Q.value = 0.5;
    gn.gain.value = 0;

    s.start();

  BLOW.f.frequency.setTargetAtTime(500 + v * 900, ctx.currentTime, 0.08);

  const out = [];

    const bh = 15, gap = 3;
    labels.forEach((label, i) => out.push({ label, x: 6, y: top + i * (bh + gap), w: W - 12, h: bh, i, kind: "opt", state: "idle" }));

  const total = widths.reduce((a, b) => a + b, 0) + gap * (labels.length - 1);
  if (total <= W - 12) {
    let x = Math.round((W - total) / 2);
    labels.forEach((label, i) => {
      out.push({ label, x, y: top, w: widths[i], h: bh, i, kind: i === (o.primary ?? labels.length - 1) ? "primary" : "btn", state: "idle" });

    labels.forEach((label, i) => out.push({ label, x: 12, y: top + i * (bh + 4), w: W - 24, h: bh, i, kind: i === (o.primary ?? labels.length - 1) ? "primary" : "btn", state: "idle" }));

// ---------------------------------------------------------------------
//  Duel Balon: two players, one phone lying flat between them.
//  The top half is drawn upside down for Fani, the bottom half for
//  William. Both halves get exactly the same balloons at the same time,
//  so whoever pops faster (and avoids the dark ones) wins.
// ---------------------------------------------------------------------
const DU = { on: false };

function startDuel() {
  const Hh = Math.floor((H - 6) / 2);
  Object.assign(DU, {
    on: true, Hh, phase: "count", t: 0, play: 0, si: 0, lastCount: -1,
    sched: duelSchedule((Math.random() * 1e9) | 0),
    players: [{ id: "fani", score: 0, balloons: [], fx: [] }, { id: "will", score: 0, balloons: [], fx: [] }],
    winner: null, done: null,
  });
  DU.bg = [duelBackground("fani"), duelBackground("will")];
  return new Promise((res) => (DU.done = res));
}

function duelSchedule(seed) {
  const R = rng(seed), out = [];
  let t = 0.3, lastX = 0.5, lastTrap = true;
  for (let i = 0; i < 260; i++) {
    const prog = Math.min(1, t / 35);
    const trap = !lastTrap && R() < 0.24;
    let x;
    do { x = 0.1 + R() * 0.8; } while (Math.abs(x - lastX) < 0.2);
    out.push({ t, x, kind: trap ? 2 : R() < 0.5 ? 0 : 1, speed: lerp(30, 54, prog) * (0.9 + R() * 0.25), ph: R() * 6.28, sway: 1.5 + R() * 2.5 });
    lastX = x;
    lastTrap = trap;
    t += lerp(0.9, 0.48, prog) * (0.75 + R() * 0.5);
  }
  return out;
}

function duelBackground(id) {
  const Hh = DU.Hh, c = mk(W, Hh), x = ctx2d(c);
  const cols = (id === "fani"
    ? ["#2a1846", "#351c55", "#432166", "#522775", "#622c82", "#72338c"]
    : ["#111f45", "#152753", "#1a3162", "#203c72", "#264882", "#2d5591"]).map(hexRGB);
  const id2 = x.createImageData(W, Hh), d = id2.data;
  for (let yy = 0; yy < Hh; yy++) {
    const t = (yy / Hh) * (cols.length - 1), i = Math.floor(t), f = t - i;
    for (let xx = 0; xx < W; xx++) {
      const cc = i < cols.length - 1 && f > bayer(xx, yy) ? cols[i + 1] : cols[i], o = (yy * W + xx) * 4;
      d[o] = cc[0]; d[o + 1] = cc[1]; d[o + 2] = cc[2]; d[o + 3] = 255;
    }
  }
  x.putImageData(id2, 0, 0);
  const R = rng(id === "fani" ? 5 : 9);
  for (let i = 0; i < (W * Hh) / 300; i++) px(Math.floor(R() * W), Math.floor(R() * Hh * 0.8), R() < 0.5 ? "#8d7fc9" : "#c7bdf2", x);
  // soft clouds along the player's edge, where balloons appear
  const cloud = id === "fani" ? "#8a3f98" : "#3a68a8", cloudHi = id === "fani" ? "#a453ad" : "#4f80bf";
  for (let xx = -6; xx < W + 6; xx += 14 + Math.floor(R() * 8)) {
    const r = 8 + Math.floor(R() * 7), cy = Hh - 13 + Math.floor(R() * 4);
    for (let yy = -r; yy <= 0; yy++) {
      const hw = Math.round(Math.sqrt(r * r - yy * yy) * 1.3);
      rect(xx - hw, cy + yy, hw * 2, 1, yy === -r ? cloudHi : cloud, x);
    }
  }
  rect(0, Hh - 18, W, 18, cloud, x);
  rect(0, Hh - 18, W, 1, cloudHi, x);
  return c;
}

function spawnBalloon(s) {
  for (const pl of DU.players)
    pl.balloons.push({ kind: s.kind, x: Math.round(14 + s.x * (W - 28)), y: DU.Hh + 12, speed: s.speed, ph: s.ph, sway: s.sway });
}

function duelUpdate(dt) {
  DU.t += dt;
  if (DU.phase === "count") {
    const n = Math.floor(DU.t / 0.75);
    if (n !== DU.lastCount && n <= 3) { DU.lastCount = n; SFX.beep(n === 3); }
    if (DU.t >= 3.1) { DU.phase = "play"; DU.play = 0; playSong("duel"); }
  } else if (DU.phase === "play") {
    DU.play += dt;
    while (DU.si < DU.sched.length && DU.sched[DU.si].t <= DU.play) spawnBalloon(DU.sched[DU.si++]);
    for (const pl of DU.players)
      for (let i = pl.balloons.length - 1; i >= 0; i--) {
        const b = pl.balloons[i];
        b.y -= b.speed * dt;
        if (b.y < -22) pl.balloons.splice(i, 1);
      }
  } else if (DU.phase === "end") {
    for (const pl of DU.players)
      for (const b of pl.balloons) b.y -= b.speed * dt * 0.4;
    if (DU.t > 3 && DU.done) { const r = DU.done; DU.done = null; r(); }
  }
  for (const pl of DU.players)
    for (let i = pl.fx.length - 1; i >= 0; i--) {
      const f = pl.fx[i];
      f.age += dt;
      if (f.age > f.max) { pl.fx.splice(i, 1); continue; }
      f.vy += (f.g || 0) * dt;
      f.x += (f.vx || 0) * dt;
      f.y += (f.vy || 0) * dt;
    }
}

function balloonPos(b) {
  return { x: b.x + Math.round(Math.sin(DU.play * 2.2 + b.ph) * b.sway), y: Math.round(b.y) };
}

function duelDown(p) {
  if (DU.phase !== "play") return;
  const Hh = DU.Hh;
  let pl, lx, ly;
  if (p.y >= H - Hh) { pl = DU.players[1]; lx = p.x; ly = p.y - (H - Hh); }
  else if (p.y < Hh) { pl = DU.players[0]; lx = W - p.x; ly = Hh - p.y; }
  else return;
  let best = -1, bd = 1e9;
  for (let i = 0; i < pl.balloons.length; i++) {
    const { x, y } = balloonPos(pl.balloons[i]);
    const dx = (lx - x) / 13, dy = (ly - y) / 15, dd = dx * dx + dy * dy;
    if (dd <= 1 && dd < bd) { bd = dd; best = i; }
  }
  if (best < 0) return;
  const b = pl.balloons[best], pos = balloonPos(b);
  pl.balloons.splice(best, 1);
  const good = b.kind !== 2;
  pl.score = Math.max(0, pl.score + (good ? 1 : -1));
  pl.fx.push({ type: "burst", x: pos.x, y: pos.y, age: 0, max: 0.14 });
  pl.fx.push({ type: "label", text: good ? "+1" : "-1", c: good ? "#ffffff" : "#ff7a9a", x: pos.x, y: pos.y - 12, vy: -22, age: 0, max: 0.7 });
  const cols = [["#ff8cc0", "#ffd0e6"], ["#6cb6ff", "#d2ebff"], ["#5d5672", "#2c2838"]][b.kind];
  for (let k = 0; k < 10; k++) {
    const a = Math.random() * Math.PI * 2, sp = randf(20, 55);
    pl.fx.push({ type: "dot", c: pick(cols), x: pos.x, y: pos.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 40, age: 0, max: randf(0.3, 0.6) });
  }
  if (good) SFX.pop(); else SFX.trap();
  pl.flash = T;
  if (pl.score >= CFG.duelTarget) {
    DU.phase = "end";
    DU.t = 0;
    DU.winner = pl.id;
    stopSong(0.2);
    SFX.win();
    for (let k = 0; k < 40; k++)
      pl.fx.push({ type: "confetti", c: pick(["#ff8cc0", "#6cb6ff", "#ffe27a", "#ffffff", "#c9b2ff"]), x: randf(0, W), y: randf(-30, 0), vx: randf(-10, 10), vy: randf(25, 50), age: 0, max: 3, w: 2, h: 1, ph: Math.random() * 6 });
  }
}

function drawHalf(pl, top) {

    } else textOC("MULAI!", W >> 1, cy - 7, "#ffe27a", K, 2);

// ---------------------------------------------------------------------
//  Photobooth: front camera -> high-resolution pixel art in a frame.
//  The photo never leaves the phone: it is read from the camera, turned
//  into pixels here, and only saved if the save button is pressed.
// ---------------------------------------------------------------------
const cam = document.getElementById("cam");
const photoImg = document.getElementById("photo");
const pickEl = document.getElementById("pick");
const ART_W = 160, ART_H = 200; // the pixel-art grid
const FRAME_W = 180, FRAME_H = 225; // the frame around it (4:5, saved x6 = 1080x1350)

function frameRect() {
  const x = Math.round((W - FRAME_W) / 2);
  const y = Math.max(6, Math.round((H - FRAME_H - 44) / 2));
  return { x, y, w: FRAME_W, h: FRAME_H };
}
function placePhotoOverlay() {
  if (S.mode !== "photo" || PH.phase !== "result" || !PH.url) {
    photoImg.style.display = "none";
    return;
  }
  const r = frameRect();
  Object.assign(photoImg.style, {
    display: "block",
    left: OX + (r.x * N) / DPR + "px",
    top: OY + (r.y * N) / DPR + "px",
    width: (r.w * N) / DPR + "px",
    height: (r.h * N) / DPR + "px",
  });
}

// ---- camera ------------------------------------------------------------
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false,
    });
    cam.srcObject = stream;
    cam.muted = true;
    try { await cam.play(); } catch (e) {}
    for (let i = 0; i < 80 && !cam.videoWidth; i++) await wait(0.05);
    if (!cam.videoWidth) { closeCamera(); return false; }
    return true;
  } catch (e) {
    return false;
  }
}
function closeCamera() {
  const s = cam.srcObject;
  if (s) s.getTracks().forEach((t) => t.stop());
  cam.srcObject = null;
}
function cropBox(w, h) {
  let sw = w, sh = (w * 5) / 4;

}

  PH.liveAt = T + 1 / 30;

  const c = PH.prevCtx, { sx, sy, sw, sh } = cropBox(cam.videoWidth, cam.videoHeight);
  c.save();
  c.setTransform(-1, 0, 0, 1, ART_W, 0);
  c.imageSmoothingEnabled = true;
  c.drawImage(cam, sx, sy, sw, sh, 0, 0, ART_W, ART_H);
  c.restore();
  const id = c.getImageData(0, 0, ART_W, ART_H), d = id.data, step = 255 / 5;
  for (let y = 0, o = 0; y < ART_H; y++)
    for (let x = 0; x < ART_W; x++, o += 4) {
      const th = (bayer(x, y) - 0.5) * step * 0.85;
      for (let k = 0; k < 3; k++) d[o + k] = Math.round(clamp((d[o + k] - 128) * 1.1 + 128 + th, 0, 255) / step) * step;

}

  const { sx, sy, sw, sh } = cropBox(cam.videoWidth, cam.videoHeight);
  const c = mk(Math.round(sw), Math.round(sh)), x = c.getContext("2d");
  x.translate(c.width, 0);
  x.scale(-1, 1);
  x.drawImage(cam, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const { sx, sw, sh } = cropBox(w, h), sy = (h - sh) * topBias;
  const scale = Math.min(1, 1600 / sh);
  const c = mk(Math.round(sw * scale), Math.round(sh * scale));
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function loadImage(file) {
  return new Promise((res, rej) => {

    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };

function startDrag(p, id) {

function moveDrag(p) {

  if (Math.abs(dy) > 3) DRAG.moved = true;

function updateBlow(dt) {
  if (!S.blowing) {
    S.wind = Math.max(0, S.wind - dt * 4);
    return;
  }
  const holding = POINTERS.size > 0 || KEYHOLD;
  const breath = micLevel();
  const blowing = holding || breath > 0.12;
  S.wind = blowing ? Math.min(1, S.wind + dt * (holding ? 3 : 2 + breath * 3)) : Math.max(0, S.wind - dt * 4);
  S.blowT += dt * S.wind;
  blowLevel(holding ? S.wind : 0); // her real breath is the sound when she blows into the mic
  let left = 0;
  for (const c of S.candles) {
    if (c.lit && S.blowT >= c.th) {
      c.lit = false;
      SFX.puff();
      for (let k = 0; k < 5; k++) addPart({ type: "smoke", x: c.x + randf(-1, 1), y: c.base - 9, vx: randf(2, 8), vy: randf(-14, -7), max: randf(0.8, 1.4) });
    }
    if (c.lit) left++;
  }
  if (blowing && Math.random() < dt * 30)
    addPart({ type: "streak", x: L.cx + randf(-40, 40), y: L.gy + 8, vx: randf(-6, 6), vy: -150, max: 0.45 });
  const d = dialogRect();
  UI.hint = { text: left ? "Sisa lilin: " + left : "Yeay!", y: d.y + d.h + 12, blink: !blowing && left > 0 };
}

// ---------------------------------------------------------------------
//  Blowing into the microphone. The first moment sets the room's noise
//  level; a breath shows up as a big jump in the low frequencies.
// ---------------------------------------------------------------------
const MIC = { on: false };
async function startMic() {
  if (!AU.ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try { if (navigator.audioSession) navigator.audioSession.type = "play-and-record"; } catch (e) {}
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: false,
    });
    const src = AU.ctx.createMediaStreamSource(stream), an = AU.ctx.createAnalyser();
    an.fftSize = 1024;
    an.smoothingTimeConstant = 0.4;
    src.connect(an); // analysed only, never sent to the speaker
    Object.assign(MIC, { on: true, stream, src, an, buf: new Float32Array(an.frequencyBinCount), floor: -200, t0: T });
    if (AU.ctx.state !== "running") AU.ctx.resume().catch(() => {});
    AU.music.gain.setTargetAtTime(0.25, AU.ctx.currentTime, 0.2); // quieter music so it isn't heard as wind
    return true;
  } catch (e) {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e2) {}
    return false;
  }
}
function micLevel() {
  if (!MIC.on) return 0;
  MIC.an.getFloatFrequencyData(MIC.buf);
  const hz = AU.ctx.sampleRate / MIC.an.fftSize;
  let e = 0, n = 0;
  for (let i = 1; i * hz < 700; i++) { e += Math.pow(10, MIC.buf[i] / 10); n++; }
  const db = 10 * Math.log10(e / Math.max(1, n) + 1e-20);
  if (T - MIC.t0 < 0.8) { MIC.floor = Math.max(MIC.floor, db); return 0; }
  return clamp((db - MIC.floor - 12) / 14, 0, 1);
}
function stopMic() {
  if (!MIC.on) return;
  MIC.on = false;
  try { MIC.src.disconnect(); } catch (e) {}
  MIC.stream.getTracks().forEach((t) => t.stop());
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  AU.music.gain.setTargetAtTime(0.8, AU.ctx.currentTime, 0.4);
}

const GF = { phase: null, t0: 0, taps: 0, shakeT: -9, card: null };
function loadURL(url) {

function giftBoxPos() {

function giftCardY() {

function drawGiftBox(cx, by, lidUp) {
  // body 44x30, lid 50x10, blue ribbon and bow
  const bw = 44, bh = 30, x = cx - bw / 2, y = by - bh;
  rect(x - 1, y - 1, bw + 2, bh + 2, K);
  rect(x, y, bw, bh, "#ff8cc0");
  rect(x + bw - 6, y, 6, bh, "#e0609e");
  rect(x, y, bw, 2, "#ffb3d6");
  rect(cx - 3, y, 6, bh, "#4f9dff");
  rect(cx - 3, y, 2, bh, "#9fd0ff");
  const ly = y - 10 - lidUp;
  rect(x - 4, ly - 1, bw + 8, 12, K);
  rect(x - 3, ly, bw + 6, 10, "#ff9fd0");

  rect(cx - 3, ly, 6, 10, "#4f9dff");

    tri(cx, ly - 1, cx + s * 11, ly - 7, cx + s * 9, ly, "#6cb6ff");

function drawGift() {
  dim(0.55);
  const t = T - GF.t0, { x, y } = giftBoxPos();
  if (GF.phase === "box" || GF.phase === "open") {
    const lift = GF.phase === "open" ? Math.round(easeOut(clamp(t / 0.5, 0, 1)) * 40) : 0;
    const shake = T - GF.shakeT < 0.35 ? Math.round(Math.sin((T - GF.shakeT) * 50) * 3) : 0;
    const hop = GF.phase === "box" ? Math.round(Math.abs(Math.sin(T * 3)) * -2) : 0;
    if (GF.phase === "open") {
      g.globalCompositeOperation = "lighter";
      g.globalAlpha = clamp(t / 0.4, 0, 1) * 0.8;
      g.drawImage(glow(40, "#ffe9a8"), x - 40, y - 70);
      g.globalAlpha = 1;
      g.globalCompositeOperation = "source-over";
    }
    shadowOval(x, y + 1, 26, 3, 0.6);
    drawGiftBox(x + shake, y + hop, lift);
  }
  if ((GF.phase === "reveal" || GF.phase === "done") && GF.card) {
    const cy = giftCardY(), p = clamp(t / 0.9, 0, 1);
    const yy = Math.round(lerp(y, cy, easeOut(p)));
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.5;
    g.drawImage(glow(60, "#ff9fd0"), L.cx - 60, yy + FRAME_H / 2 - 60);
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
    rect(L.cx - FRAME_W / 2 + 3, yy + 3, FRAME_W, FRAME_H, "#05030c");
    g.drawImage(GF.card, L.cx - FRAME_W / 2, yy);
  }
}

const POINTERS = new Map();
let KEYHOLD = false;

function onTap(p) {
  if (S.mode === "gate") {
    unlockAudio();
    if (GATE.res && !FADE) GATE.res();
    return;
  }
  unlockAudio();
  if (hitMute(p)) { setMuted(!AU.muted); return; }
  if (S.mode === "duel" || FADE) return;
  if (dragEnded) { dragEnded = false; return; }
  const b = hitButton(p);
  if (b) {
    if (b.state === "idle" && (!UI.pressed || UI.pressed === b)) { SFX.select(); b.onTap(); }
    return;
  }
  if (finishTyping()) return;
  if (letterRevealAll()) return;
  if (UI.waitTap) {
    const r = UI.waitTap;
    UI.waitTap = null;
    r();
  }
}

view.addEventListener("pointerdown", (e) => {
  const p = toLogical(e);
  POINTERS.set(e.pointerId, p);
  dragEnded = false;
  try { view.setPointerCapture(e.pointerId); } catch (err) {}
  if (S.mode === "duel") { duelDown(p); return; }
  const b = hitButton(p);
  UI.pressed = b && b.state === "idle" ? b : null;
  if (S.mode === "letter" && LT.phase === "read" && !UI.pressed) startDrag(p, e.pointerId);
});
view.addEventListener("pointermove", (e) => {
  if (!POINTERS.has(e.pointerId)) return;
  const p = toLogical(e);
  POINTERS.set(e.pointerId, p);
  if (DRAG && DRAG.id === e.pointerId) moveDrag(p);
});
function pointerGone(e) {
  POINTERS.delete(e.pointerId);
  if (DRAG && DRAG.id === e.pointerId) {
    dragEnded = DRAG.moved;
    DRAG = null;
  }
}
view.addEventListener("pointerup", pointerGone);
view.addEventListener("pointercancel", (e) => { pointerGone(e); UI.pressed = null; });
view.addEventListener("click", (e) => {
  onTap(toLogical(e));
  UI.pressed = null;
});
view.addEventListener("contextmenu", (e) => e.preventDefault());
view.addEventListener("wheel", (e) => {
  if (S.mode === "letter" && LT.phase === "read") {
    e.preventDefault();
    LT.scroll = clamp(LT.scroll + (e.deltaY * DPR) / N, 0, maxScroll());
    LT.userAt = T;
  }
}, { passive: false });
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " " || k === "Enter") {
    e.preventDefault();
    if (e.repeat) return;
    if (S.blowing) { unlockAudio(); KEYHOLD = true; return; }
    const idle = UI.buttons.filter((b) => b.state === "idle");
    if (idle.length === 1 && !(UI.dialog && !UI.dialog.done)) { unlockAudio(); SFX.select(); idle[0].onTap(); return; }
    onTap({ x: -99, y: -99 });
    return;
  }
  if (k === "m" || k === "M") { setMuted(!AU.muted); return; }
  const n = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k.toLowerCase());
  const b = n >= 0 ? UI.buttons[n] : null;
  if (b && b.kind === "opt" && b.state === "idle") { unlockAudio(); SFX.select(); b.onTap(); }
});
window.addEventListener("keyup", (e) => {
  if (e.key === " " || e.key === "Enter") KEYHOLD = false;
});
window.addEventListener("blur", () => { KEYHOLD = false; POINTERS.clear(); });
document.addEventListener("visibilitychange", () => {
  if (!AU.ctx) return;
  if (document.hidden) AU.ctx.suspend().catch(() => {});
  else if (S.mode !== "gate") AU.ctx.resume().catch(() => {});
});
window.addEventListener("resize", () => {
  resize();
  if (DU.on) { DU.Hh = Math.floor((H - 6) / 2); DU.bg = [duelBackground("fani"), duelBackground("will")]; }
  if (LT.phase === "read") layoutLetter();
});

function update(dt) {
  updateDialog(dt);
  updateFade(dt);
  updateParts(dt);
  if (S.mode === "duel" && DU.on) duelUpdate(dt);
  if (S.party) updateParty(dt);
  if (S.mode === "photo" && (PH.phase === "live" || PH.phase === "count")) updatePreview();
  if (S.mode === "letter") updateLetter(dt);
  updateBlow(dt);
}
function render() {
  if (S.mode === "duel" && DU.on) drawDuel();
  else {
    drawWorld();
    if (S.party) drawParty();
    drawParts(0);
    if (S.mode === "gate") drawGate();
    if (S.mode === "photo") drawPhoto();
    if (S.mode === "letter") drawLetter();
    if (S.mode === "gift") drawGift();
  }
  drawDialog();
  drawButtons();
  drawHint();
  drawToast();
  drawMute();
  drawFade();
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? clamp((now - last) / 1000, 0, 0.1) : 0;
  last = now;
  T += dt;
  runTimers();
  update(dt);
  render();
  vctx.drawImage(scr, 0, 0, W * N, H * N);
}

function boot() {
  buildChars();
  buildBalloons();
  buildSongs();
  resize();
  FADE = { t: 0, dur: 0.9, out: false, mid: null, res: () => {} };
  requestAnimationFrame(frame);
  story().catch((err) => {
    console.error(err);
    toast("Ups, ada yang error. Coba muat ulang, ya.", 8);
  });
}
boot();
</script>
</body>
</html>
